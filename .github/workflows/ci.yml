name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and lint
        run: bun run check

      # @kloucy/docs is excluded: its check-types needs the generated
      # src/routeTree.gen.ts (gitignored, produced by the Vite router plugin),
      # which is not available in a fresh checkout.
      - name: Type check
        run: bunx turbo run check-types --filter=@kloucy/api... --filter=@kloucy/mobile... --filter=@kloucy/web...
